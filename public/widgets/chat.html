<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>antena · chat</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<link href="/fonts.css" rel="stylesheet"><link href="/widgets/widget.css" rel="stylesheet"><link href="/theme.css" rel="stylesheet" id="eg-theme">
<style>
@layer egdev {
.root{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:18px;--fs:26px}
.msg{display:flex;gap:12px;align-items:flex-start;padding:12px 16px 13px;border-radius:calc(16px * var(--round,1));font-size:var(--fs);line-height:1.3;
  background:var(--surface-bg,linear-gradient(160deg,rgba(28,28,32,.92),rgba(10,10,12,.94)));border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--red);
  box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);max-width:100%}
.msg.a-slide{animation:in .35s cubic-bezier(.2,1.3,.4,1) both}
.msg.a-fade{animation:inF .35s ease-out both}
.msg.a-pop{animation:inP .35s cubic-bezier(.2,1.3,.4,1) both}
.msg.a-bounce{animation:inB .6s cubic-bezier(.28,.84,.42,1) both}
.msg.a-zoom{animation:inZ .35s cubic-bezier(.2,1,.3,1) both}
.msg.a-flip{animation:inFl .45s cubic-bezier(.2,1,.3,1) both;transform-origin:top center}
.msg.a-blur{animation:inBl .4s ease-out both}
.msg.a-drop{animation:inD .45s cubic-bezier(.25,1,.5,1) both}
.msg.a-none{animation:none}
.msg.out.o-slide{animation:out .45s ease-in forwards}
.msg.out.o-fade{animation:outF .35s ease-in forwards}
.msg.out.o-pop{animation:outP .35s ease-in forwards}
.msg.out.o-bounce{animation:outB .55s cubic-bezier(.55,0,.75,.2) forwards}
.msg.out.o-zoom{animation:outZ .35s ease-in forwards}
.msg.out.o-flip{animation:outFl .4s ease-in forwards;transform-origin:top center}
.msg.out.o-blur{animation:outBl .4s ease-in forwards}
.msg.out.o-drop{animation:outD .45s cubic-bezier(.5,0,.75,0) forwards}
.msg.out.o-none{animation:none}
.root.reverse{flex-direction:column-reverse}
/* :not(.out): la entrada invertida nunca pisa la animación de salida */
.reverse .msg.a-slide:not(.out){animation-name:inR}
.reverse .msg.a-bounce:not(.out){animation-name:inBR}
.reverse .msg.a-flip:not(.out){animation-name:inFlR;transform-origin:bottom center}
.reverse .msg.out.o-slide{animation-name:outR}
.reverse .msg.out.o-bounce{animation-name:outBR}
.reverse .msg.out.o-flip{animation-name:outFlR;transform-origin:bottom center}
.msg.mod{border-left-color:#fff}
@keyframes in{from{opacity:0;transform:translateX(-24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(-24px)}}
@keyframes inF{from{opacity:0}to{opacity:1}}
@keyframes inP{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes outF{to{opacity:0}}
@keyframes inR{from{opacity:0;transform:translateX(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes outR{to{opacity:0;transform:translateX(24px)}}
@keyframes inB{0%{opacity:0;transform:translateY(60px)}55%{opacity:1;transform:translateY(-10px)}75%{transform:translateY(4px)}100%{opacity:1;transform:none}}
@keyframes inBR{0%{opacity:0;transform:translateY(-60px)}55%{opacity:1;transform:translateY(10px)}75%{transform:translateY(-4px)}100%{opacity:1;transform:none}}
@keyframes inZ{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:none}}
@keyframes inFl{from{opacity:0;transform:perspective(600px) rotateX(-80deg)}to{opacity:1;transform:none}}
@keyframes inFlR{from{opacity:0;transform:perspective(600px) rotateX(80deg)}to{opacity:1;transform:none}}
@keyframes inBl{from{opacity:0;filter:blur(12px)}to{opacity:1;filter:none}}
@keyframes outZ{to{opacity:0;transform:scale(.6)}}
@keyframes outBl{to{opacity:0;filter:blur(12px)}}
@keyframes outD{to{opacity:0;transform:translateY(80px) rotate(4deg)}}
@keyframes inD{from{opacity:0;transform:translateY(-80px) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes outP{30%{opacity:1;transform:scale(1.06)}to{opacity:0;transform:scale(.6)}}
@keyframes outB{25%{transform:translateY(10px)}to{opacity:0;transform:translateY(-60px)}}
@keyframes outBR{25%{transform:translateY(-10px)}to{opacity:0;transform:translateY(60px)}}
@keyframes outFl{to{opacity:0;transform:perspective(600px) rotateX(-80deg)}}
@keyframes outFlR{to{opacity:0;transform:perspective(600px) rotateX(80deg)}}
.body{min-width:0;flex:1}
.who{display:flex;align-items:center;gap:8px;font:800 .78em/1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--red-2);margin-bottom:5px}
.who .pf{display:inline-flex;align-items:center;font:700 .62em/1 var(--f-cond);letter-spacing:.16em;color:var(--muted);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:3px 6px 2px}
.who .pf svg{width:1.1em;height:1.1em}
.who .b{color:var(--pink);font-size:.8em}
.text{font-weight:500;color:var(--white);overflow-wrap:anywhere}
.text img{height:1.3em;vertical-align:-.3em;margin:0 .05em}

/* La fila solo afecta al layout horizontal; los tokens y el CSS propio siguen mandando. */
.root.horizontal{flex-direction:row;justify-content:flex-end;align-items:center;overflow:hidden;
  /* Por debajo de 160px se reducen los espacios; a 160px se conservan las medidas originales. */
  --h-root-pad:min(18px,11.25vh);--h-card-top:min(12px,7.5vh);--h-card-bottom:min(13px,8.125vh);
  --h-who-gap:min(5px,3.125vh);--h-pf-top:min(3px,1.875vh);--h-pf-bottom:min(2px,1.25vh);
  --h-inner:calc(100vh - 2 * var(--h-root-pad));
  /* Reservas para autor y dos líneas; el icono puede ser más alto que el nombre. */
  --h-text-space:calc(var(--h-card-top) + var(--h-card-bottom) + var(--h-who-gap) + 6px);
  --h-icon-space:calc(var(--h-card-top) + var(--h-card-bottom) + var(--h-who-gap) + var(--h-pf-top) + var(--h-pf-bottom) + 5px);
  --horizontal-fs:min(var(--fs),max(0px,calc((var(--h-inner) - var(--h-text-space)) / 3.38)),max(0px,calc((var(--h-inner) - var(--h-icon-space)) / 3.132)));
  padding-top:var(--h-root-pad);padding-bottom:var(--h-root-pad);
  mask-image:linear-gradient(to right,transparent,#000 min(140px,20%),#000 100%)}
.root.horizontal.reverse{flex-direction:row-reverse;
  mask-image:linear-gradient(to left,transparent,#000 min(140px,20%),#000 100%)}
.horizontal .msg{flex:0 0 min(380px,100%);min-width:0;font-size:var(--horizontal-fs);
  height:max(min(104px,65vh),calc(var(--horizontal-fs) * 3.38 + var(--h-text-space)),calc(var(--horizontal-fs) * 3.132 + var(--h-icon-space)));
  padding-top:var(--h-card-top);padding-bottom:var(--h-card-bottom);
  border-color:var(--surface-border,color-mix(in srgb,var(--red-2) 55%,transparent));
  box-shadow:0 0 12px color-mix(in srgb,var(--red) calc(35% * var(--glow,1)),transparent),inset 0 0 18px color-mix(in srgb,var(--red) calc(10% * var(--glow,1)),transparent),inset 0 1px 0 rgba(255,255,255,.08),0 10px 26px rgba(0,0,0,.45)}
.horizontal .body{height:100%;overflow:hidden}
.horizontal .who{white-space:nowrap;overflow:hidden;margin-bottom:var(--h-who-gap)}
.horizontal .who .pf{padding-top:var(--h-pf-top);padding-bottom:var(--h-pf-bottom)}
.horizontal .text{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}

/* Las clases e ids son los mismos: solo se orientan los efectos con dirección. */
.horizontal .msg.a-slide:not(.out){animation-name:inH}
.horizontal .msg.a-bounce:not(.out){animation-name:inBH}
.horizontal .msg.a-drop:not(.out){animation-name:inDH}
.horizontal .msg.a-flip:not(.out){animation-name:inFlH;transform-origin:right center}
.horizontal .msg.out.o-slide{animation-name:outH}
.horizontal .msg.out.o-bounce{animation-name:outBH}
.horizontal .msg.out.o-drop{animation-name:outDH}
.horizontal .msg.out.o-flip{animation-name:outFlH;transform-origin:left center}
.horizontal.reverse .msg.a-slide:not(.out){animation-name:inHR}
.horizontal.reverse .msg.a-bounce:not(.out){animation-name:inBHR}
.horizontal.reverse .msg.a-drop:not(.out){animation-name:inDHR}
.horizontal.reverse .msg.a-flip:not(.out){animation-name:inFlHR;transform-origin:left center}
.horizontal.reverse .msg.out.o-slide{animation-name:outHR}
.horizontal.reverse .msg.out.o-bounce{animation-name:outBHR}
.horizontal.reverse .msg.out.o-drop{animation-name:outDHR}
.horizontal.reverse .msg.out.o-flip{animation-name:outFlHR;transform-origin:right center}
@keyframes inH{from{opacity:0;transform:translateX(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes outH{to{opacity:0;transform:translateX(-24px)}}
@keyframes inHR{from{opacity:0;transform:translateX(-24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes outHR{to{opacity:0;transform:translateX(24px)}}
@keyframes inBH{0%{opacity:0;transform:translateX(60px)}55%{opacity:1;transform:translateX(-10px)}75%{transform:translateX(4px)}100%{opacity:1;transform:none}}
@keyframes inBHR{0%{opacity:0;transform:translateX(-60px)}55%{opacity:1;transform:translateX(10px)}75%{transform:translateX(-4px)}100%{opacity:1;transform:none}}
@keyframes outBH{25%{transform:translateX(10px)}to{opacity:0;transform:translateX(-60px)}}
@keyframes outBHR{25%{transform:translateX(-10px)}to{opacity:0;transform:translateX(60px)}}
@keyframes inDH{from{opacity:0;transform:translateX(80px) rotate(4deg)}to{opacity:1;transform:none}}
@keyframes inDHR{from{opacity:0;transform:translateX(-80px) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes outDH{to{opacity:0;transform:translateX(-80px) rotate(-4deg)}}
@keyframes outDHR{to{opacity:0;transform:translateX(80px) rotate(4deg)}}
@keyframes inFlH{from{opacity:0;transform:perspective(600px) rotateY(80deg)}to{opacity:1;transform:none}}
@keyframes inFlHR{from{opacity:0;transform:perspective(600px) rotateY(-80deg)}to{opacity:1;transform:none}}
@keyframes outFlH{to{opacity:0;transform:perspective(600px) rotateY(-80deg)}}
@keyframes outFlHR{to{opacity:0;transform:perspective(600px) rotateY(80deg)}}
@media (prefers-reduced-motion:reduce){.root.horizontal .msg{animation:none!important}}
}
</style></head>
<body><div class="root" id="root"></div>
<script type="module">
import { LOGOS, platformSvg } from '/platform-icons.js';
import { connect, DEMO, demoChat, setCss, qs } from '/widgets/widget.js';
import { CHAT_ANIMS } from '/widgets/chat-anims.js';
const root = document.getElementById('root');
const variantId = qs.get('variant');
const DEFAULT_CHAT = { platforms: ['twitch', 'youtube'], maxMessages: 12, fadeAfterSec: 0, fontSize: 26, hideCommands: true, hideOwner: true, showPlatform: true, reverse: false, animIn: 'slide', animOut: 'slide', layout: 'vertical', css: '' };
let cfg = { ...DEFAULT_CHAT };
// Las mismas animaciones para entrar y salir: las direccionales siguen al orden y al layout.
// En vertical se conserva la caída por gravedad; en horizontal sigue el eje de la fila.
const ANIM_IN = Object.fromEntries(CHAT_ANIMS.map(a => [a, 'a-' + a]));
const ANIM_OUT = Object.fromEntries(CHAT_ANIMS.map(a => [a, 'o-' + a]));
let demoN = 0;

// Logos de plataforma: SVG por DOM con las rutas fijas de /platform-icons.js

function visible(m) {
  if (!cfg.platforms?.includes(m.platform)) return false;
  if (cfg.hideCommands && m.command) return false;
  return !(cfg.hideOwner !== false && m.owner); // lo que escribes tú (y los mensajes programados) no sale en pantalla
}

// Icono de plataforma en la cabecera del mensaje (se añade o se quita al cambiar showPlatform).
function setPlatform(el) {
  const who = el.querySelector('.who'), cur = who.querySelector('.pf'), m = el._m;
  const want = !!cfg.showPlatform && !!LOGOS[m.platform];
  if (!want) { cur?.remove(); return; }
  if (cur) return;
  const pf = document.createElement('span'); pf.className = 'pf';
  pf.append(platformSvg(m.platform));   // SVG construido por DOM con las rutas fijas de /platform-icons.js
  who.append(pf);
}

// Tope de mensajes: el que sobra sale con la animación de salida, igual que al caducar.
// Los que ya están saliendo no cuentan para el tope.
function trim() {
  const max = Number(cfg.maxMessages) || 12;
  let live = [...root.children].filter(el => !el.classList.contains('out'));
  for (const el of live.slice(0, Math.max(0, live.length - max))) expire(el);
  if (cfg.layout !== 'horizontal') return;

  // El ancho permite una tarjeta parcialmente visible en el borde de salida. Se mide el
  // layout sin transformar (también con ?scale), no la posición durante la animación.
  const style = getComputedStyle(root);
  const width = Math.max(0, root.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
  const gap = parseFloat(style.columnGap) || 0;
  live = [...root.children].filter(el => !el.classList.contains('out'));
  let used = 0, kept = 0;
  for (const el of live.reverse()) {
    // Incluso si el padding ocupa todo el ancho, se conserva solo el mensaje más reciente.
    if (kept && used >= width) expire(el);
    else { used += el.offsetWidth + gap; kept++; }
  }
  // Una salida ya totalmente fuera no puede verse ni animarse en la capa. Retirarla evita
  // acumular nodos durante ráfagas, pero las salidas visibles terminan normalmente.
  for (const el of root.querySelectorAll('.msg.out')) {
    if (el.offsetLeft + el.offsetWidth <= 0 || el.offsetLeft >= root.clientWidth) {
      clearTimeout(el._out); clearTimeout(el._fade); el.remove();
    }
  }
}

// Se quita del DOM al terminar su animación de salida (o al momento si no tiene), con un
// tope de seguridad por si animationend no llega.
function expire(el) {
  if (el.classList.contains('out')) return;
  clearTimeout(el._fade);
  el.classList.add('out', ANIM_OUT[cfg.animOut] || 'o-slide');
  if (getComputedStyle(el).animationName === 'none') { el.remove(); return; }
  // solo cuenta el fin de la animación del propio mensaje: animationend sube desde los hijos
  // (por ejemplo, una animación del CSS propio sobre .who)
  const onEnd = e => { if (e.target === el) done(); };
  const done = () => { clearTimeout(el._out); el.removeEventListener('animationend', onEnd); el.remove(); };
  el.addEventListener('animationend', onEnd);
  el._out = setTimeout(done, 1000);
}

// La caducidad cuenta desde que entró el mensaje: cambiar la config no reinicia el reloj.
function scheduleFade(el) {
  clearTimeout(el._fade);
  const fade = Number(cfg.fadeAfterSec) || 0;
  if (fade > 0 && !el.classList.contains('out')) el._fade = setTimeout(() => expire(el), Math.max(0, fade * 1000 - (Date.now() - el._at)));
}

function render(m) {
  if (!visible(m)) return;
  const el = document.createElement('div');
  el.className = 'msg pf-' + (m.platform || 'egdev') + ' ' + (ANIM_IN[cfg.animIn] || 'a-slide') + (m.mod || m.owner ? ' mod' : '');
  el.dataset.id = m.id; el.dataset.login = m.login || ''; el._m = m; el._at = Date.now();
  // Construcción por DOM (sin innerHTML): el texto del chat nunca entra como HTML.
  const body = document.createElement('div'); body.className = 'body';
  const who = document.createElement('div'); who.className = 'who';
  who.append(document.createTextNode(m.user ?? ''));
  const b = document.createElement('span'); b.className = 'b';
  if (m.owner) b.textContent = '◆ host'; else if (m.mod) b.textContent = '◆ mod'; else if (m.member) b.textContent = '◆';
  if (b.textContent) who.append(b);
  const text = document.createElement('div'); text.className = 'text';
  for (const p of (m.parts?.length ? m.parts : [{ t: m.text }])) {
    if (p.e) {
      const img = document.createElement('img'); img.src = p.e; img.alt = p.alt ?? '';
      text.append(img);
    } else text.append(document.createTextNode(p.t ?? ''));
  }
  body.append(who, text); el.append(body);
  setPlatform(el);
  root.append(el);
  trim();
  scheduleFade(el);
}

// Los cambios de configuración se reaplican en sitio a los mensajes ya pintados (filtros, icono,
// tope y caducidad) sin reconstruirlos: no se resetean temporizadores ni se repiten entradas.
// En la vista previa (demo) un cambio de efecto se enseña al momento con una muestra.
function apply(w) {
  const prev = cfg;
  const selected = variantId && Array.isArray(w?.chatVariants) && w.chatVariants.find(v => v?.id === variantId);
  cfg = { ...DEFAULT_CHAT, ...(selected || w?.chat || {}) };
  root.style.setProperty('--fs', (Number(cfg.fontSize) || 26) + 'px');
  root.classList.toggle('reverse', !!cfg.reverse);
  root.classList.toggle('horizontal', cfg.layout === 'horizontal');
  // Config aplicada, observable desde fuera (las pruebas esperan a esto en vez de a un tiempo fijo).
  root.dataset.animIn = cfg.animIn; root.dataset.animOut = cfg.animOut; root.dataset.fade = String(Number(cfg.fadeAfterSec) || 0);
  setCss(cfg.css);
  for (const el of [...root.children]) {
    if (!el._m) continue;
    if (!visible(el._m)) { clearTimeout(el._fade); el.remove(); continue; }
    setPlatform(el);
    scheduleFade(el);
  }
  trim();
  if (DEMO && cfg.animOut !== prev.animOut && root.firstElementChild) expire(root.firstElementChild);
  if (DEMO && cfg.animIn !== prev.animIn) render(demoChat(demoN++));
}

// Al cambiar el tamaño de la capa se vuelve a limitar el DOM, sin suscripción adicional.
new ResizeObserver(() => { if (cfg.layout === 'horizontal') trim(); }).observe(root);
let first = true;
connect({
  widgets: s => { apply(s.widgets); if (first && !DEMO) (s.chat || []).slice(-(Number(cfg.maxMessages) || 12)).forEach(render); first = false; },
  chat: m => { if (!DEMO) render(m); },
  chatDelete: ({ id }) => root.querySelector(`[data-id="${CSS.escape(id)}"]`)?.remove(),
  chatClear: ({ login }) => [...root.children].forEach(el => { if (!login || el.dataset.login === login) el.remove(); }),
});
if (DEMO) { for (; demoN < 6; demoN++) render(demoChat(demoN)); setInterval(() => render(demoChat(demoN++)), 2200); }
</script></body></html>
