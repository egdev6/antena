<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>antena · chat</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<link href="/fonts.css" rel="stylesheet"><link href="/widgets/widget.css" rel="stylesheet"><link href="/theme.css" rel="stylesheet" id="eg-theme">
<style>
@layer egdev {
.root{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:18px;--fs:26px}
.msg{display:flex;gap:12px;align-items:flex-start;padding:12px 16px 13px;border-radius:calc(16px * var(--round,1));font-size:var(--fs);line-height:1.3;
  background:var(--surface-bg,linear-gradient(160deg,rgba(28,28,32,.92),rgba(10,10,12,.94)));border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--red);
  box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);max-width:100%}
.msg.a-slide{animation:in .35s cubic-bezier(.2,1.3,.4,1) both}
.msg.a-fade{animation:inF .35s ease-out both}
.msg.a-pop{animation:inP .35s cubic-bezier(.2,1.3,.4,1) both}
.msg.a-bounce{animation:inB .6s cubic-bezier(.28,.84,.42,1) both}
.msg.a-zoom{animation:inZ .35s cubic-bezier(.2,1,.3,1) both}
.msg.a-flip{animation:inFl .45s cubic-bezier(.2,1,.3,1) both;transform-origin:top center}
.msg.a-blur{animation:inBl .4s ease-out both}
.msg.a-none{animation:none}
.msg.out.o-slide{animation:out .45s ease-in forwards}
.msg.out.o-fade{animation:outF .35s ease-in forwards}
.msg.out.o-zoom{animation:outZ .35s ease-in forwards}
.msg.out.o-blur{animation:outBl .4s ease-in forwards}
.msg.out.o-drop{animation:outD .45s cubic-bezier(.5,0,.75,0) forwards}
.msg.out.o-none{animation:none}
.root.reverse{flex-direction:column-reverse}
.reverse .msg.a-slide{animation-name:inR}
.reverse .msg.a-bounce{animation-name:inBR}
.reverse .msg.a-flip{animation-name:inFlR;transform-origin:bottom center}
.reverse .msg.out.o-slide{animation-name:outR}
.reverse .msg.out.o-drop{animation-name:outDR}
.msg.mod{border-left-color:#fff}
@keyframes in{from{opacity:0;transform:translateX(-24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(-24px)}}
@keyframes inF{from{opacity:0}to{opacity:1}}
@keyframes inP{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes outF{to{opacity:0}}
@keyframes inR{from{opacity:0;transform:translateX(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes outR{to{opacity:0;transform:translateX(24px)}}
@keyframes inB{0%{opacity:0;transform:translateY(60px)}55%{opacity:1;transform:translateY(-10px)}75%{transform:translateY(4px)}100%{opacity:1;transform:none}}
@keyframes inBR{0%{opacity:0;transform:translateY(-60px)}55%{opacity:1;transform:translateY(10px)}75%{transform:translateY(-4px)}100%{opacity:1;transform:none}}
@keyframes inZ{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:none}}
@keyframes inFl{from{opacity:0;transform:perspective(600px) rotateX(-80deg)}to{opacity:1;transform:none}}
@keyframes inFlR{from{opacity:0;transform:perspective(600px) rotateX(80deg)}to{opacity:1;transform:none}}
@keyframes inBl{from{opacity:0;filter:blur(12px)}to{opacity:1;filter:none}}
@keyframes outZ{to{opacity:0;transform:scale(.6)}}
@keyframes outBl{to{opacity:0;filter:blur(12px)}}
@keyframes outD{to{opacity:0;transform:translateY(80px) rotate(4deg)}}
@keyframes outDR{to{opacity:0;transform:translateY(-80px) rotate(-4deg)}}
.body{min-width:0;flex:1}
.who{display:flex;align-items:center;gap:8px;font:800 .78em/1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--red-2);margin-bottom:5px}
.who .pf{display:inline-flex;align-items:center;font:700 .62em/1 var(--f-cond);letter-spacing:.16em;color:var(--muted);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:3px 6px 2px}
.who .pf svg{width:1.1em;height:1.1em}
.who .b{color:var(--pink);font-size:.8em}
.text{font-weight:500;color:var(--white);overflow-wrap:anywhere}
.text img{height:1.3em;vertical-align:-.3em;margin:0 .05em}
}
</style></head>
<body><div class="root" id="root"></div>
<script type="module">
import { LOGOS, platformSvg } from '/platform-icons.js';
import { connect, DEMO, demoChat, setCss } from '/widgets/widget.js';
const root = document.getElementById('root');
let cfg = { platforms: ['twitch', 'youtube'], maxMessages: 12, fadeAfterSec: 0, fontSize: 26, hideCommands: true, hideOwner: true, showPlatform: true, reverse: false, animIn: 'slide', animOut: 'slide' };
const ANIM_IN = { slide: 'a-slide', fade: 'a-fade', pop: 'a-pop', bounce: 'a-bounce', zoom: 'a-zoom', flip: 'a-flip', blur: 'a-blur', none: 'a-none' };
const ANIM_OUT = { slide: 'o-slide', fade: 'o-fade', zoom: 'o-zoom', blur: 'o-blur', drop: 'o-drop', none: 'o-none' };
let demoN = 0;

// Logos de plataforma: SVG por DOM con las rutas fijas de /platform-icons.js

function visible(m) {
  if (!cfg.platforms?.includes(m.platform)) return false;
  if (cfg.hideCommands && m.command) return false;
  return !(cfg.hideOwner !== false && m.owner); // lo que escribes tú (y los mensajes programados) no sale en pantalla
}

// Icono de plataforma en la cabecera del mensaje (se añade o se quita al cambiar showPlatform).
function setPlatform(el) {
  const who = el.querySelector('.who'), cur = who.querySelector('.pf'), m = el._m;
  const want = !!cfg.showPlatform && !!LOGOS[m.platform];
  if (!want) { cur?.remove(); return; }
  if (cur) return;
  const pf = document.createElement('span'); pf.className = 'pf';
  pf.append(platformSvg(m.platform));   // SVG construido por DOM con las rutas fijas de /platform-icons.js
  who.append(pf);
}

function trim() { while (root.children.length > (Number(cfg.maxMessages) || 12)) root.firstElementChild.remove(); }

function expire(el) {
  if (el.classList.contains('out')) return;
  clearTimeout(el._fade);
  el.classList.add('out', ANIM_OUT[cfg.animOut] || 'o-slide'); setTimeout(() => el.remove(), 500);
}

// La caducidad cuenta desde que entró el mensaje: cambiar la config no reinicia el reloj.
function scheduleFade(el) {
  clearTimeout(el._fade);
  const fade = Number(cfg.fadeAfterSec) || 0;
  if (fade > 0 && !el.classList.contains('out')) el._fade = setTimeout(() => expire(el), Math.max(0, fade * 1000 - (Date.now() - el._at)));
}

function render(m) {
  if (!visible(m)) return;
  const el = document.createElement('div');
  el.className = 'msg pf-' + (m.platform || 'egdev') + ' ' + (ANIM_IN[cfg.animIn] || 'a-slide') + (m.mod || m.owner ? ' mod' : '');
  el.dataset.id = m.id; el.dataset.login = m.login || ''; el._m = m; el._at = Date.now();
  // Construcción por DOM (sin innerHTML): el texto del chat nunca entra como HTML.
  const body = document.createElement('div'); body.className = 'body';
  const who = document.createElement('div'); who.className = 'who';
  who.append(document.createTextNode(m.user ?? ''));
  const b = document.createElement('span'); b.className = 'b';
  if (m.owner) b.textContent = '◆ host'; else if (m.mod) b.textContent = '◆ mod'; else if (m.member) b.textContent = '◆';
  if (b.textContent) who.append(b);
  const text = document.createElement('div'); text.className = 'text';
  for (const p of (m.parts?.length ? m.parts : [{ t: m.text }])) {
    if (p.e) {
      const img = document.createElement('img'); img.src = p.e; img.alt = p.alt ?? '';
      text.append(img);
    } else text.append(document.createTextNode(p.t ?? ''));
  }
  body.append(who, text); el.append(body);
  setPlatform(el);
  root.append(el);
  trim();
  scheduleFade(el);
}

// Los cambios de configuración se reaplican en sitio a los mensajes ya pintados (filtros, icono,
// tope y caducidad) sin reconstruirlos: no se resetean temporizadores ni se repiten entradas.
// En la vista previa (demo) un cambio de efecto se enseña al momento con una muestra.
function apply(w) {
  const prev = cfg;
  cfg = { ...cfg, ...(w?.chat || {}) };
  root.style.setProperty('--fs', (Number(cfg.fontSize) || 26) + 'px');
  root.classList.toggle('reverse', !!cfg.reverse);
  setCss(cfg.css);
  for (const el of [...root.children]) {
    if (!el._m) continue;
    if (!visible(el._m)) { clearTimeout(el._fade); el.remove(); continue; }
    setPlatform(el);
    scheduleFade(el);
  }
  trim();
  if (DEMO && cfg.animOut !== prev.animOut && root.firstElementChild) expire(root.firstElementChild);
  if (DEMO && cfg.animIn !== prev.animIn) render(demoChat(demoN++));
}

let first = true;
connect({
  widgets: s => { apply(s.widgets); if (first && !DEMO) (s.chat || []).slice(-(Number(cfg.maxMessages) || 12)).forEach(render); first = false; },
  chat: m => { if (!DEMO) render(m); },
  chatDelete: ({ id }) => root.querySelector(`[data-id="${CSS.escape(id)}"]`)?.remove(),
  chatClear: ({ login }) => [...root.children].forEach(el => { if (!login || el.dataset.login === login) el.remove(); }),
});
if (DEMO) { for (; demoN < 6; demoN++) render(demoChat(demoN)); setInterval(() => render(demoChat(demoN++)), 2200); }
</script></body></html>
