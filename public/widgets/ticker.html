<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>antena · ticker</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<link href="/fonts.css" rel="stylesheet"><link href="/widgets/widget.css" rel="stylesheet"><link href="/theme.css" rel="stylesheet" id="eg-theme">
<style>
@layer egdev {
.root{display:flex;align-items:flex-end}
.band{position:relative;width:100%;height:64px;display:flex;align-items:center;overflow:hidden;
  background:var(--surface-bg,linear-gradient(180deg,rgba(20,20,24,.95),rgba(6,6,8,.97)));border-top:var(--line-w,2px) solid var(--red);box-shadow:0 -6px 30px color-mix(in srgb,var(--red) calc(35% * var(--glow,1)),transparent)}
.label{position:relative;z-index:2;height:100%;display:flex;align-items:center;gap:10px;padding:0 26px 0 22px;flex:none;
  background:linear-gradient(90deg,var(--red-dark),var(--red));font:800 24px/1 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;
  clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);box-shadow:0 0 24px var(--red)}
.label::before{content:"";width:10px;height:10px;background:#fff;transform:rotate(45deg)}
.track{flex:1;overflow:hidden;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.run{display:inline-flex;align-items:center;height:100%;white-space:nowrap;will-change:transform}
.it{display:inline-flex;align-items:center;gap:10px;padding:0 26px;font:600 24px var(--f-body);color:var(--grey)}
.it b{font:800 28px/1 var(--f-cond);text-transform:uppercase;color:var(--white)}
.it .k{font:700 14px var(--f-cond);letter-spacing:.18em;text-transform:uppercase;color:var(--pink)}
.it::after{content:"";width:8px;height:8px;background:var(--red);transform:rotate(45deg);margin-left:26px;box-shadow:0 0 8px var(--red)}
}
</style></head>
<body><div class="root"><div class="band"><div class="label" id="label">Gracias a</div><div class="track"><div class="run" id="run"></div></div></div></div>
<script type="module">
import { connect, DEMO, demoState, esc, setCss } from '/widgets/widget.js';
const run = document.getElementById('run');
let anim, key = '';
function apply(s) {
  const cfg = s.widgets?.ticker || {};
  setCss(cfg.css);
  document.getElementById('label').textContent = cfg.label || 'Gracias a';
  const items = (s.recent || []).slice(0, Number(cfg.count) || 15);
  const html = items.length
    ? items.map(e => `<span class="it"><span class="k">${esc(e.label)}</span><b>${esc(e.user)}</b>${e.sub ? esc(e.sub) : ''}</span>`).join('')
    : '<span class="it"><b>egdev.es</b>directos los miércoles a las 19:00</span>';
  const k = html + (cfg.speed || 70);
  if (k === key) return; key = k;
  run.innerHTML = html + html; // doble para que el bucle no tenga saltos
  anim?.cancel();
  requestAnimationFrame(() => {
    const w = run.scrollWidth / 2;
    anim = run.animate([{ transform: 'translateX(0)' }, { transform: `translateX(-${w}px)` }], { duration: w / (Number(cfg.speed) || 70) * 1000, iterations: Infinity });
  });
}
connect({ widgets: s => apply(DEMO ? { ...demoState(), widgets: s.widgets } : s) });
if (DEMO) apply(demoState());
</script></body></html>
