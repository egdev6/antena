<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>antena · créditos</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<link href="/fonts.css" rel="stylesheet"><link href="/widgets/widget.css" rel="stylesheet"><link href="/theme.css" rel="stylesheet" id="eg-theme">
<style>
@layer egdev {
body.solid{background:radial-gradient(1200px 700px at 50% 0%,color-mix(in srgb,var(--red) calc(16% * var(--glow,1)),transparent),transparent 70%),#000}
.root{overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent)}
.roll{position:absolute;left:0;right:0;top:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:70px;padding:0 40px;will-change:transform}
.head,.grp,.end{position:relative;width:min(1200px,100%);padding:36px 48px}
.head .kick{justify-content:center;margin-bottom:18px}
.head .big{font-size:92px}
.head .sub{font:600 26px var(--f-body);color:var(--grey);margin-top:14px}
.grp .kick{justify-content:center;font-size:24px;margin-bottom:22px}
.grp ul{list-style:none;display:grid;gap:10px}
.grp li{font:800 46px/1.05 var(--f-cond);text-transform:uppercase}
.grp li:nth-child(odd){text-shadow:0 0 18px color-mix(in srgb,var(--red) calc(45% * var(--glow,1)),transparent)}
.end .big{font-size:64px}
.end .sub{font:600 26px var(--f-body);color:var(--grey);margin-top:14px}
.idle{position:absolute;inset:0;display:grid;place-items:center;font:700 26px var(--f-cond);letter-spacing:.2em;text-transform:uppercase;color:#555}
}
</style></head>
<body><div class="root" id="root"></div>
<script type="module">
import { connect, DEMO, demoState, qs, setCss } from '/widgets/widget.js';
const root = document.getElementById('root');
if (!qs.has('transparent')) document.body.classList.add('solid');
let state = null, anim = null;
// The roll is built once and edited in place (#365): playing again rewrites only the text that changed,
// always through textContent, so titles and names stay text and never become markup.
const make = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
const setText = (node, text) => { if (node.textContent !== text) node.textContent = text; };
const headTitle = make('p', 'big'), headSub = make('p', 'sub'), endSub = make('p', 'sub');
const endBig = make('p', 'big', 'Nos vemos ');
endBig.append(make('span', 'hl', 'el miércoles'));
const head = make('div', 'head eg-card'), end = make('div', 'end eg-card'), roll = make('div', 'roll');
head.append(make('p', 'kick', 'Créditos'), headTitle, headSub);
end.append(endBig, endSub);
roll.id = 'roll';
roll.append(head, end);
const idle = make('p', 'idle', 'Créditos en espera');
let groups = [];   // { title, box, list } in screen order: one card per title, reused between plays
function groupCard(title) {
  const box = make('div', 'grp eg-card soft');
  box.append(make('p', 'kick', title));
  return { title, box, list: null };
}
function setNames(group, names) {
  if (!names) { group.list?.remove(); group.list = null; return; }
  group.list ||= group.box.appendChild(make('ul'));
  names.forEach((name, i) => setText(group.list.children[i] || group.list.appendChild(make('li')), name));
  while (group.list.children.length > names.length) group.list.lastElementChild.remove();
}
function sync(s) {
  const cfg = s.widgets?.credits || {};
  setCss(cfg.css);
  setText(headTitle, cfg.title || 'Gracias por estar');
  setText(headSub, s.session?.title || 'Directo');
  setText(endSub, cfg.subtitle || '');
  const pool = new Map(groups.map(g => [g.title, g]));
  groups = (s.credits?.length ? s.credits : [{ title: 'Y a todo el chat' }]).map(({ title, names }) => {
    const group = pool.get(title) || groupCard(title);
    pool.delete(title);
    setNames(group, names);
    return group;
  });
  for (const g of pool.values()) g.box.remove();
  groups.forEach((g, i) => { if (roll.children[i + 1] !== g.box) roll.insertBefore(g.box, roll.children[i + 1]); });
}
function play() {
  if (!state) return;
  sync(state);
  if (!roll.isConnected) root.replaceChildren(roll);
  anim?.cancel();
  const dist = roll.offsetHeight + innerHeight / (Number(qs.get('scale')) || 1);
  anim = roll.animate([{ transform: 'translateY(0)' }, { transform: `translateY(-${dist}px)` }], { duration: dist / (Number(state.widgets?.credits?.speed) || 60) * 1000, easing: 'linear', fill: 'forwards' });
  if (qs.has('loop') || DEMO) anim.onfinish = () => play();
}
function stop() { anim?.cancel(); root.replaceChildren(...(qs.has('debug') ? [idle] : [])); }
connect({
  widgets: s => { state = DEMO ? { ...demoState(), widgets: s.widgets } : s; if (DEMO && !anim) play(); },
  credits: ({ action }) => action === 'stop' ? stop() : play(),
});
stop();
if (DEMO) { state = demoState(); play(); }
if (qs.has('autoplay')) setTimeout(play, 800);
</script></body></html>
