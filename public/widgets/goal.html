<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>antena · objetivo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<link href="/fonts.css" rel="stylesheet"><link href="/widgets/widget.css" rel="stylesheet"><link href="/theme.css" rel="stylesheet" id="eg-theme">
<style>
@layer egdev {
.root{display:flex;align-items:center;justify-content:center;padding:30px}
.goal{width:min(900px,100%);padding:24px 30px 26px;position:relative}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.head .t{flex:1;min-width:0}
.title{font:800 44px/.95 var(--f-cond);text-transform:uppercase;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{font:800 44px/.95 var(--f-cond);white-space:nowrap}
.nums small{font-size:.55em;color:var(--muted);letter-spacing:.06em}
.bar{position:relative;height:48px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);overflow:hidden}
.bar + .bar{margin-top:12px}
/* #364: only transform, translate and opacity animate. The fill is a full-width pill that slides in by --p (progress 0..1,
   set per bar by the script), so its round tip and glow are never stretched the way a scaleX would. The gradient is sized to the visible part
   and the stripes slide the other way to stay anchored to the bar. While empty the pill sits 40px further left, so its
   glow does not leak onto the track. */
.fill{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  transform:translateX(calc((var(--p,0) - 1) * 100% - (1 - min(1,var(--p,0) * 1000)) * 40px));transition:transform 1.1s cubic-bezier(.2,1,.3,1);
  background:linear-gradient(90deg,var(--red-dark),var(--red) 70%,var(--red-2)) right/calc(var(--p,0) * 100%) 100% no-repeat var(--red-dark);box-shadow:0 0 18px var(--red),inset 0 1px 0 rgba(255,255,255,.35)}
.fill::after{content:"";position:absolute;inset:0 0 0 -56px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.14) 0 12px,transparent 12px 26px);
  translate:calc((1 - var(--p,0)) * (100% - 56px)) 0;transition:translate 1.1s cubic-bezier(.2,1,.3,1);animation:move 1.6s linear infinite}
@keyframes move{to{transform:translateX(56px)}}
.bar{display:flex;align-items:center;gap:12px;padding:0 14px}
.bar .pf-ico{position:relative;width:24px;height:24px;flex:none}
.pct{position:relative;margin-left:auto;flex:none;font:700 24px var(--f-cond);color:var(--white);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.metric{position:relative;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 16px var(--f-cond);letter-spacing:.06em;color:var(--white);text-shadow:0 1px 2px #000;text-transform:uppercase}
@media(max-width:500px){.root{padding:16px}.goal{padding:20px 16px}.title{font-size:30px}.bar{gap:8px;padding:0 10px}.pct{font-size:20px}.metric{font-size:14px}}
/* #364: the done pulse fades a layer instead of animating box-shadow. The card keeps its own shadow; the layer adds what the
   old peak had on top of it (the 40px glow ignored --glow, so it fades in as the glow is lowered). */
.goal.done::after{content:"";position:absolute;inset:calc(var(--line-w,2px) * -1);border-radius:inherit;pointer-events:none;opacity:0;animation:done 1.4s ease-in-out infinite alternate;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--red-2) calc(50% * var(--glow,1)),transparent),0 0 40px color-mix(in srgb,var(--red) calc(100% * max(0,1 - var(--glow,1))),transparent),0 0 120px color-mix(in srgb,var(--red) calc(70% * var(--glow,1)),transparent),inset 0 0 40px color-mix(in srgb,var(--red) calc(12% * var(--glow,1)),transparent)}
@keyframes done{to{opacity:1}}
}
</style></head>
<body><div class="root"><div class="goal eg-card" id="goal">
  <div class="head"><div class="t"><p class="kick" id="kick">Objetivo</p><p class="title" id="title"></p></div></div>
  <div id="bars"></div>
</div></div>
<script type="module">
import { platformSvg } from '/platform-icons.js';
import { connect, DEMO, demoState, qs, setCss } from '/widgets/widget.js';
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('es-ES', { maximumFractionDigits: 2 });
const LABELS = { follows: 'Seguidores', subs: 'Suscripciones', bits: 'Bits', raids: 'Raids', subscribers: 'Suscriptores', superchats: 'Super Chats (€)', members: 'Miembros', events: 'Eventos' };
// #128: una caja puede tener varias barras (una por plataforma). Cada barra visible pinta
// su propio progreso con su métrica y su meta; showMetric oculta la etiqueta «qué cuenta».
// Logos de plataforma: SVG por DOM con las rutas fijas de /platform-icons.js, nunca marcado configurable.
// O1.6: las barras se actualizan en su sitio por id (solo se crean las nuevas y se quitan las que
// faltan) para que la transición de .fill anime la subida de cada barra por separado.
// O1.1: cada barra lleva pf-<plataforma>, así el color de cada plataforma de Apariencia la pinta.
function barRow(b) {
  const row = document.createElement('div');
  row.className = 'bar';
  row.dataset.id = b.id;
  const fill = document.createElement('div');
  fill.className = 'fill';
  const pctEl = document.createElement('span');
  pctEl.className = 'pct';
  row.append(fill, pctEl);
  return row;
}
function updateRow(row, b, g) {
  const target = Number(b.target) || 0;
  const value = DEMO ? Math.round(target * 0.7) : (b.value === null ? null : (b.value ?? 0));
  const shown = value === null ? '—' : fmt(value);
  const pct = Math.max(0, Math.min(100, target ? (value ?? 0) / target * 100 : 0));
  if (row.dataset.platform !== b.platform) {
    row.dataset.platform = b.platform;
    row.className = 'bar pf-' + b.platform;
    row.querySelector('.pf-ico')?.remove();
    const ico = platformSvg(b.platform); if (ico) row.querySelector('.fill').after(ico);
  }
  row.querySelector('.fill').style.setProperty('--p', +(pct / 100).toFixed(4));
  let metric = row.querySelector('.metric');
  if (g.showMetric !== false) {
    if (!metric) { metric = document.createElement('span'); metric.className = 'metric'; row.querySelector('.pct').before(metric); }
    metric.textContent = LABELS[b.metric] || b.metric;
  } else metric?.remove();
  row.querySelector('.pct').textContent = `${shown}/${fmt(target)}`;
  row.title = `${shown} / ${fmt(target)}`;
  return pct;
}
function apply(s) {
  const goals = s.goals || [];
  const g = goals.find(x => x.id === qs.get('id')) || goals[0];
  // F2 (#128): una caja oculta (visible:false) esconde TODAS sus barras; al reactivarla
  // vuelven tal estaban. Cada barra respeta además su propia visible.
  const barras = g ? (g.bars || []).filter(b => b.visible !== false) : [];
  if (!g || g.visible === false || !barras.length) { $('goal').style.display = 'none'; return; }
  $('goal').style.display = '';
  // O1.3: etiqueta editable (vacía = «Objetivo») y etiqueta/título ocultables.
  $('kick').textContent = g.label || 'Objetivo';
  $('kick').style.display = g.showLabel === false ? 'none' : '';
  $('title').textContent = g.title;
  $('title').style.display = g.showTitle === false ? 'none' : '';
  const box = $('bars');
  const rows = new Map(Array.from(box.children, r => [r.dataset.id, r]));
  const ids = new Set(barras.map(b => b.id));
  for (const [id, row] of rows) if (!ids.has(id)) row.remove();
  let allDone = true;
  barras.forEach((b, i) => {
    const row = rows.get(b.id) || barRow(b);
    if (updateRow(row, b, g) < 100) allDone = false;
    if (box.children[i] !== row) box.insertBefore(row, box.children[i] || null);
  });
  $('goal').classList.toggle('done', allDone);
  setCss(g.css);
}
connect({ widgets: s => apply({ ...s, goals: (s.goals || []).map(g => ({ ...g, bars: (g.bars || []).map(b => ({ ...b, metric: b.metric })) })) }) });
if (DEMO) apply({ goals: (demoState().goals || [{ id: 'demo', title: 'Objetivo', showMetric: true, bars: [{ id: 'd1', platform: 'twitch', metric: 'follows', target: 100, visible: true }, { id: 'd2', platform: 'youtube', metric: 'superchats', target: 50, visible: true }] }]) });
</script></body></html>
