<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>EGDEV · objetivo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<link href="/fonts.css" rel="stylesheet"><link href="/widgets/widget.css" rel="stylesheet"><link href="/theme.css" rel="stylesheet" id="eg-theme">
<style>
@layer egdev {
.root{display:flex;align-items:center;justify-content:center;padding:30px}
.goal{width:min(900px,100%);padding:24px 30px 26px;position:relative}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.head .t{flex:1;min-width:0}
.title{font:800 44px/.95 var(--f-cond);text-transform:uppercase;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{font:800 44px/.95 var(--f-cond);white-space:nowrap}
.nums small{font-size:.55em;color:var(--muted);letter-spacing:.06em}
.bar{position:relative;height:48px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);overflow:hidden}
.bar + .bar{margin-top:12px}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;transition:width 1.1s cubic-bezier(.2,1,.3,1);
  background:linear-gradient(90deg,var(--red-dark),var(--red) 70%,var(--red-2));box-shadow:0 0 18px var(--red),inset 0 1px 0 rgba(255,255,255,.35)}
.fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.14) 0 12px,transparent 12px 26px);animation:move 1.6s linear infinite}
@keyframes move{to{background-position:56px 0}}
.bar{display:flex;align-items:center;gap:12px;padding:0 14px}
.bar .pf-ico{position:relative;width:24px;height:24px;flex:none}
.pct{position:relative;margin-left:auto;flex:none;font:700 24px var(--f-cond);color:var(--white);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.metric{position:relative;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 16px var(--f-cond);letter-spacing:.06em;color:var(--white);text-shadow:0 1px 2px #000;text-transform:uppercase}
@media(max-width:500px){.root{padding:16px}.goal{padding:20px 16px}.title{font-size:30px}.bar{gap:8px;padding:0 10px}.pct{font-size:20px}.metric{font-size:14px}}
.goal.done{animation:done 1.4s ease-in-out infinite alternate}
@keyframes done{to{box-shadow:0 0 0 1px color-mix(in srgb,var(--red-2) calc(80% * var(--glow,1)),transparent),0 0 40px var(--red),0 0 120px color-mix(in srgb,var(--red) calc(70% * var(--glow,1)),transparent),inset 0 0 40px color-mix(in srgb,var(--red) calc(25% * var(--glow,1)),transparent)}}
}
</style></head>
<body><div class="root"><div class="goal eg-card" id="goal">
  <div class="head"><div class="t"><p class="kick" id="kick">Objetivo</p><p class="title" id="title"></p></div></div>
  <div id="bars"></div>
</div></div>
<script type="module">
import { platformSvg } from '/platform-icons.js';
import { connect, DEMO, demoState, qs, setCss } from '/widgets/widget.js';
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('es-ES', { maximumFractionDigits: 2 });
const LABELS = { follows: 'Seguidores', subs: 'Suscripciones', bits: 'Bits', raids: 'Raids', superchats: 'Super Chats (€)', members: 'Miembros', events: 'Eventos' };
// #128: una caja puede tener varias barras (una por plataforma). Cada barra visible pinta
// su propio progreso con su métrica y su meta; showMetric oculta la etiqueta «qué cuenta».
// Logos de plataforma: SVG por DOM con las rutas fijas de /platform-icons.js, nunca marcado configurable.
function apply(s) {
  const goals = s.goals || [];
  const g = goals.find(x => x.id === qs.get('id')) || goals[0];
  // F2 (#128): una caja oculta (visible:false) esconde TODAS sus barras; al reactivarla
  // vuelven tal estaban. Cada barra respeta además su propia visible.
  const barras = g ? (g.bars || []).filter(b => b.visible !== false) : [];
  if (!g || g.visible === false || !barras.length) { $('goal').style.display = 'none'; return; }
  $('goal').style.display = '';
  $('kick').textContent = 'Objetivo';
  $('title').textContent = g.title;
  const bars = barras;
  $('bars').replaceChildren();
  let allDone = bars.length > 0;
  for (const b of bars) {
    const target = Number(b.target) || 0;
    const value = DEMO ? Math.round(target * 0.7) : (b.value ?? 0);
    const pct = Math.max(0, Math.min(100, target ? value / target * 100 : 0));
    if (pct < 100) allDone = false;
    const row = document.createElement('div');
    row.className = 'bar';
    const fill = document.createElement('div');
    fill.className = 'fill';
    fill.style.width = pct + '%';
    row.appendChild(fill);
    const ico = platformSvg(b.platform); if (ico) row.appendChild(ico);
    if (g.showMetric !== false) {
      const metric = document.createElement('span');
      metric.className = 'metric';
      metric.textContent = LABELS[b.metric] || b.metric;
      row.appendChild(metric);
    }
    const pctEl = document.createElement('span');
    pctEl.className = 'pct';
    pctEl.textContent = `${fmt(value)}/${fmt(target)}`;
    row.appendChild(pctEl);
    row.title = `${fmt(value)} / ${fmt(target)}`;
    $('bars').appendChild(row);
  }
  $('goal').classList.toggle('done', allDone);
  setCss(g.css);
}
connect({ widgets: s => apply({ ...s, goals: (s.goals || []).map(g => ({ ...g, bars: (g.bars || []).map(b => ({ ...b, metric: b.metric })) })) }) });
if (DEMO) apply({ goals: (demoState().goals || [{ id: 'demo', title: 'Objetivo', showMetric: true, bars: [{ id: 'd1', platform: 'twitch', metric: 'follows', target: 100, visible: true }, { id: 'd2', platform: 'youtube', metric: 'superchats', target: 50, visible: true }] }]) });
</script></body></html>
