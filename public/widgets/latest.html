<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>antena · últimos</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<link href="/fonts.css" rel="stylesheet"><link href="/widgets/widget.css" rel="stylesheet"><link href="/theme.css" rel="stylesheet" id="eg-theme">
<style>
@layer egdev {
.root{display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px;padding:18px}
.root.col{flex-direction:column}
.item{position:relative;min-width:260px;padding:16px 20px 18px;border-radius:18px}
.item .big{font-size:40px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.item .extra{font:600 18px var(--f-body);color:var(--grey);margin-top:6px}
/* #364: the flash fades a layer that holds the glow instead of animating box-shadow. The old shadow lists (outer vs inset)
   could not interpolate, so the glow stayed on for ~0.41 s and then snapped off; the layer keeps that timing. */
.item::after{content:"";position:absolute;inset:calc(var(--line-w,2px) * -1);border-radius:inherit;pointer-events:none;opacity:0;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--red-2) calc(90% * var(--glow,1)),transparent),0 0 60px var(--red)}
.item.flash::after{animation:flash .41s step-end}
@keyframes flash{from{opacity:1}}
.empty{opacity:.45}
.root>.label{flex-basis:100%;margin:0;font:800 18px/1 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
}
</style></head>
<body><div class="root" id="root"></div>
<script type="module">
import { connect, DEMO, demoState, qs, setCss } from '/widgets/widget.js';
const root = document.getElementById('root');
if (qs.get('layout') === 'column') root.classList.add('col');
const LABELS = { follow: 'Último seguidor', sub: 'Última suscripción', cheer: 'Últimos bits', raid: 'Último raid', superchat: 'Último Super Chat', member: 'Último miembro', any: 'Último evento' };
const extra = (k, e) => k === 'cheer' ? `${e.vars?.amount ?? ''} bits` : k === 'raid' ? `${e.vars?.amount ?? ''} personas` : k === 'superchat' ? (e.vars?.amountText || '') : '';
const make = (tag, cls, text = '') => Object.assign(document.createElement(tag), { className: cls, textContent: text });
const setText = (node, text) => { const value = String(text ?? ''); if (node.textContent !== value) node.textContent = value; };
const label = make('p', 'label');
let cards = new Map(), css = '';
function makeCard(k) {
  const box = make('div', `item eg-card soft item-${k}`), big = make('p', 'big');
  box.append(make('p', 'kick', LABELS[k]), big);
  return { box, big, extra: null, prev: null };
}
function flash(box) {
  // A second change can arrive before the first flash ends.
  if (box.classList.contains('flash')) {
    box.classList.remove('flash');
    void getComputedStyle(box, '::after').animationName;
  }
  box.classList.add('flash');
}
root.addEventListener('animationend', e => {
  if (e.animationName === 'flash' && e.pseudoElement === '::after' && e.target.classList.contains('item')) e.target.classList.remove('flash');
});
function apply(s) {
  const cfg = s.widgets?.latest || {};
  if ((cfg.css || '') !== css) setCss(css = cfg.css || '');
  // scope «all» (#357): the last supporters of every stream; otherwise only this stream's.
  const latest = cfg.scope === 'all' && s.latestAll ? s.latestAll : s.latest;
  const items = (qs.get('items')?.split(',') || cfg.items || ['follow', 'sub', 'cheer', 'superchat']).filter(k => Object.hasOwn(LABELS, k));
  const next = new Map(), occurrences = {}, flashing = [];
  const order = items.map(k => {
    const key = `${k}:${occurrences[k] = (occurrences[k] || 0) + 1}`;
    const card = cards.get(key) || makeCard(k);
    const e = latest?.[k], stamp = e ? e.user + e.at : null;
    if (e && card.prev && card.prev !== stamp) flashing.push(card.box);
    card.prev = stamp;
    card.box.classList.toggle('empty', !e);
    if (!e) card.box.classList.toggle('flash', false);
    setText(card.big, e ? e.user : '—');
    const detail = e && extra(k, e);
    if (detail) {
      card.extra ||= card.box.appendChild(make('p', 'extra'));
      setText(card.extra, detail);
    } else if (card.extra) { card.extra.remove(); card.extra = null; }
    next.set(key, card);
    return card.box;
  });
  // Optional label (widgets.latest.label): empty shows nothing.
  if (cfg.label) { setText(label, cfg.label); order.unshift(label); }
  else if (label.isConnected) label.remove();
  for (const [key, card] of cards) if (!next.has(key)) card.box.remove();
  cards = next;
  order.forEach((box, i) => { if (root.children[i] !== box) root.insertBefore(box, root.children[i] || null); });
  flashing.forEach(flash);
}
connect({ widgets: s => apply(DEMO ? { ...demoState(), widgets: s.widgets } : s) });
if (DEMO) apply(demoState());
</script></body></html>
