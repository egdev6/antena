<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>antena · tier list</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<link href="/fonts.css" rel="stylesheet"><link href="/widgets/widget.css" rel="stylesheet"><link href="/theme.css" rel="stylesheet" id="eg-theme">
<style>
@layer egdev {
.root{display:flex;align-items:center;justify-content:center;padding:36px}
.board{width:min(1700px,100%);padding:26px 30px 30px;display:grid;gap:18px;opacity:0;transform:translateY(24px);transition:opacity .4s,transform .5s cubic-bezier(.2,1.2,.4,1)}
.board.on{opacity:1;transform:none}
.top{display:flex;align-items:flex-end;gap:20px}
.top .big{font-size:58px}
.top .hint{margin-left:auto;font:700 20px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:110px 1fr;min-height:86px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.tier{display:grid;place-items:center;font:800 46px/1 var(--f-cond);color:#0b0b0d;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.items{display:flex;flex-wrap:wrap;align-content:center;gap:8px;padding:10px 12px}
.chip{display:flex;align-items:center;gap:10px;height:64px;padding:0 18px;border-radius:calc(12px * var(--round,1));background:var(--surface-bg,linear-gradient(160deg,#26262c,#121216));border:1px solid rgba(255,255,255,.12);
  font:800 26px var(--f-cond);text-transform:uppercase;color:var(--white);box-shadow:0 8px 18px rgba(0,0,0,.4);animation:drop .5s cubic-bezier(.2,1.4,.4,1) both}
.chip img{height:48px;width:48px;object-fit:cover;border-radius:8px}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.9)}}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.12)}
.pool .chip{opacity:.55;height:52px;font-size:21px}
.pool:empty{display:none}
/* votación */
/* #66: fixed column split and single-line texts, so changing votes or names never resizes the panel */
.vote{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:22px;align-items:center;padding:18px 22px;border-radius:16px;border:2px solid var(--red-2);
  background:linear-gradient(160deg,rgba(60,10,22,.9),rgba(16,8,10,.95));box-shadow:0 0 30px color-mix(in srgb,var(--red) calc(55% * var(--glow,1)),transparent),inset 0 0 26px color-mix(in srgb,var(--red) calc(18% * var(--glow,1)),transparent)}
.vote[hidden]{display:none}
.vote .what{min-width:0}
.vote .what .kick{font-size:18px;white-space:nowrap}
.vote .what .big,.vote .what .how{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vote .what .big{font-size:60px;margin-top:6px}
.vote .what .how{margin-top:8px;font:600 21px var(--f-body);color:var(--grey)}
.vote .what .how b{color:var(--white)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:44px 1fr 60px;align-items:center;gap:12px;font:800 24px var(--f-cond)}
.bar i{display:block;height:24px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
/* #364: only transform animates. The bar is full width and slides in by --p (votes / top votes, 0..1, set inline per bar);
   while empty it sits 24px further left, so its glow does not leak onto the track. */
.bar i b{display:block;height:100%;border-radius:8px;transform:translateX(calc((var(--p,0) - 1) * 100% - (1 - min(1,var(--p,0) * 1000)) * 24px));transition:transform .5s cubic-bezier(.2,1,.3,1)}
.bar .n{text-align:right;color:var(--grey);font-variant-numeric:tabular-nums}
.bar.win .n{color:var(--white)}
.timer{font:700 18px var(--f-mono);color:var(--pink);font-variant-numeric:tabular-nums}
}
</style></head>
<body><div class="root"><div class="board eg-card soft" id="board">
  <div class="top"><div><p class="kick">Tier list</p><p class="big" id="title"></p></div><p class="hint" id="hint"></p></div>
  <div class="vote" id="vote" hidden>
    <div class="what"><p class="kick">Vota en el chat <span class="timer" id="timer"></span></p><p class="big" id="vitem"></p><p class="how" id="how"></p></div>
    <div class="bars" id="bars"></div>
  </div>
  <div class="rows" id="rows"></div>
  <div class="pool" id="pool"></div>
</div></div>
<script type="module">
import { connect, DEMO, demoInteractive, qs, setCss } from '/widgets/widget.js';
const $ = id => document.getElementById(id);
const make = (tag, cls) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  return node;
};
const setText = (node, text) => { const value = String(text ?? ''); if (node.textContent !== value) node.textContent = value; };
const setStyle = (node, prop, value) => { node.style.removeProperty(prop); node.style.setProperty(prop, value); };

// Match by id and occurrence, so even repeated tier ids keep their own nodes.
function keyed(parent, create) {
  let previous = new Map();
  return (values, update) => {
    const next = new Map();
    const order = values.map(value => {
      let group = next.get(value.id);
      if (!group) next.set(value.id, group = []);
      const cell = previous.get(value.id)?.[group.length] || create(value);
      group.push(cell);
      update(cell, value);
      return cell.box;
    });
    for (const [id, group] of previous) {
      for (let i = next.get(id)?.length || 0; i < group.length; i++) group[i].box.remove();
    }
    order.forEach((box, i) => { if (parent.children[i] !== box) parent.insertBefore(box, parent.children[i] || null); });
    previous = next;
  };
}
function makeChip() {
  const box = make('span', 'chip'), label = document.createTextNode('');
  box.append(label);
  return { box, label, image: null };
}
function updateChip(chip, it) {
  setText(chip.label, it.label);
  if (it.image) {
    const src = `/media/${encodeURIComponent(it.image)}`;
    if (!chip.image) { chip.image = make('img'); chip.image.alt = ''; chip.box.prepend(chip.image); }
    if (chip.image.getAttribute('src') !== src) chip.image.src = src;
  } else if (chip.image) { chip.image.remove(); chip.image = null; }
}
const syncRows = keyed($('rows'), tier => {
  const box = make('div', `row tier-${tier.id}`), label = make('div', 'tier'), items = make('div', 'items');
  box.append(label, items);
  return { box, label, syncItems: keyed(items, makeChip) };
});
const syncPool = keyed($('pool'), makeChip);
const syncBars = keyed($('bars'), () => {
  const box = make('div', 'bar'), label = make('span'), track = make('i'), fill = make('b'), count = make('span', 'n');
  track.append(fill);
  box.append(label, track, count);
  return { box, label, fill, count };
});

const voteTotal = document.createTextNode('');
let instructionsKey;
function updateInstructions(tiers, cfg, total) {
  const bare = cfg.acceptBare !== false, command = cfg.command || '!tier';
  const labels = (bare ? tiers : tiers.filter(t => t.voteText)).map(t => [t.label, t.voteText]);
  const key = JSON.stringify([bare, command, labels]);
  if (key !== instructionsKey) {
    const bold = text => { const b = make('b'); setText(b, text); return b; };
    const parts = ['Escribe '];
    if (bare) {
      labels.forEach(([label, text], i) => {
        if (i) parts.push(' ');
        parts.push(bold(label));
        if (text) parts.push(` (${text})`);
      });
      parts.push(' o ');
    }
    parts.push(bold(`${command} S`));
    if (!bare) for (const [label, text] of labels) parts.push(' · ', bold(label), `: ${text}`);
    $('how').replaceChildren(...parts, voteTotal);
    instructionsKey = key;
  }
  setText(voteTotal, ` · ${total} ${total === 1 ? 'voto' : 'votos'}`);
}

let tick, voteEndsAt = null, css = '';
function setCountdown(endsAt) {
  if (endsAt === voteEndsAt) return;
  clearInterval(tick);
  voteEndsAt = endsAt;
  if (!endsAt) return;
  const end = new Date(endsAt).getTime(), timer = $('timer');
  const update = () => setText(timer, `· ${Math.max(0, Math.ceil((end - Date.now()) / 1000))}s`);
  update();
  tick = setInterval(update, 500);
}

function apply(s) {
  const cfg = s.config?.tierlist || {};
  if ((cfg.css || '') !== css) setCss(css = cfg.css || '');
  const l = (s.tierlists || []).find(x => x.id === (qs.get('id') || s.shownTierlist));
  $('board').classList.toggle('on', !!l);
  if (!l) { setCountdown(null); return; }
  setText($('title'), l.title);
  const v = s.vote?.listId === l.id ? s.vote : null;
  const placed = new Map(), pool = [];
  for (const it of l.items) {
    const tier = l.placements[it.id];
    if (tier) {
      if (!placed.has(tier)) placed.set(tier, []);
      placed.get(tier).push(it);
    } else if (it.id !== v?.item?.id) pool.push(it);
  }
  syncRows(l.tiers, (row, t) => {
    setText(row.label, t.label);
    if (row.color !== t.color) { setStyle(row.label, 'background', t.color); row.color = t.color; }
    row.syncItems(placed.get(t.id) || [], updateChip);
  });
  syncPool(qs.has('nopool') ? [] : pool, updateChip);
  $('vote').toggleAttribute('hidden', !v);
  setText($('hint'), v ? '' : `${Object.keys(l.placements).length} / ${l.items.length} colocados`);
  const endsAt = v?.endsAt || null;
  setCountdown(endsAt);
  if (!endsAt) setText($('timer'), '');
  if (!v) return;
  setText($('vitem'), v.item?.label || '');
  updateInstructions(l.tiers, cfg, v.total);
  const max = Math.max(1, ...Object.values(v.counts));
  syncBars(l.tiers, (bar, t) => {
    const count = v.counts[t.id] || 0, progress = String(count / max);
    setText(bar.label, t.voteText || t.label);
    setText(bar.count, count);
    bar.box.classList.toggle('win', v.winner === t.id);
    if (bar.fill.style.getPropertyValue('--p') !== progress) bar.fill.style.setProperty('--p', progress);
    if (bar.color !== t.color) {
      setStyle(bar.label, 'color', t.color);
      setStyle(bar.fill, 'background', t.color);
      setStyle(bar.fill, 'box-shadow', `0 0 12px ${t.color}`);
      bar.color = t.color;
    }
  });
}
connect({ interactive: s => { if (!DEMO) apply(s); } });
if (DEMO) apply(demoInteractive());
</script></body></html>
