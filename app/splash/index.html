<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>antena</title>
<style>
  :root{color-scheme:dark}
  html,body{height:100%;margin:0}
  body{display:grid;place-content:center;justify-items:center;gap:16px;background:radial-gradient(700px 360px at 50% -120px,rgba(255,0,54,.12),transparent 70%),#121214;
    color:#f2f2f4;font:500 15px/1.5 'Barlow',system-ui,sans-serif;text-align:center;padding:24px}
  .mark{width:72px;height:72px;display:block;object-fit:contain}
  h1{margin:0;font:800 28px/1 'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.02em}
  p{margin:0;color:#a0a0aa;max-width:520px}
  .bar{width:180px;height:3px;border-radius:3px;background:#2a2a30;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#ff0036;animation:go 1.1s ease-in-out infinite}
  @keyframes go{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
  body[data-error] .bar{display:none}
  #err{display:none;color:#ff6b81;white-space:pre-wrap;font:500 13px/1.5 ui-monospace,monospace;background:#1b1b20;border:1px solid #3a2228;border-radius:10px;padding:12px 14px;max-width:640px;text-align:left}
  body[data-error] #err{display:block}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
  <img class="mark" src="logo.png" alt="" aria-hidden="true">
  <h1>antena</h1>
  <p id="msg">Arrancando el servidor de alertas…</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div id="err" role="alert"></div>
<script>
  // La app llama a esto si el servidor no arranca.
  window.egdevError = (msg) => {
    document.body.dataset.error = '1';
    document.getElementById('msg').textContent = 'No se ha podido arrancar el servidor.';
    document.getElementById('err').textContent = msg;
  };
</script>
</body>
</html>
